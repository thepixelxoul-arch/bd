<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f85606"><title>Register - Amar Shop</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">AS</span><span data-store-name>Amar Shop</span></a><h1>Create account</h1><p>Join Amar Shop and start shopping.</p><form id="registerForm"><div class="field"><label>Full Name</label><input id="regName" class="form-control" required></div><div class="field" style="margin-top:10px"><label>Email</label><input id="regEmail" class="form-control" type="email" required></div><div class="field" style="margin-top:10px"><label>Phone</label><input id="regPhone" class="form-control" required></div><div class="field" style="margin-top:10px"><label>Password</label><input id="regPassword" class="form-control" type="password" minlength="6" required></div><button class="btn btn-primary" style="width:100%;margin-top:14px">Create Account</button></form><div class="auth-foot">Already have an account? <a href="login.html">Login</a></div></section></main><script src="assets/js/app.js"></script></body></html>
