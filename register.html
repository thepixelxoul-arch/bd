<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - SocialPanel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="auth-page"><div class="auth-shell"><section class="auth-hero"><div class="brand"><div class="brand-logo">SP</div><div>SocialPanel</div></div><div><span class="pill">Start demo</span><h1>Create your local demo profile.</h1><p>Your profile is stored only in this browser using localStorage.</p></div><small>No real customer account is created</small></section><section class="auth-card"><h2>Create account</h2><p class="page-subtitle">Set up a demo profile.</p><form id="registerForm"><div class="form-group"><label>Username</label><input id="regUsername" class="form-control" required></div><div class="form-group"><label>Email</label><input id="regEmail" class="form-control" type="email" required></div><div class="form-group"><label>Password</label><input id="regPassword" class="form-control" type="password" minlength="6" required></div><button class="btn btn-primary" style="width:100%">Create demo account</button></form><p class="auth-note">Already registered? <a href="login.html" style="color:var(--primary);font-weight:700">Sign in</a></p></section></div></main><script src="assets/js/app.js"></script></body></html>
